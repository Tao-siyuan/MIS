server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mis
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: tsy050904
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

mis:
  jwt:
    # 生产环境通过环境变量 MIS_JWT_SECRET 注入，避免密钥随代码泄露
    secret: ${MIS_JWT_SECRET:mis-ustb-professional-setting-and-scheduling-system-2026-secret-key}
    expire-hours: 12
  cors:
    # 允许跨域的前端来源，多个用英文逗号分隔
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
